run: docker compose up --build
seed: docker compose exec app python -m app.seed
test: docker compose run --rm app pytest -q
base_url: http://localhost:8000
endpoints:
  health: GET /health
  generate: POST /generate
  usage: GET /usage
  checkout: POST /billing/checkout
  stripe_webhook: POST /webhooks/stripe
  reconcile: POST /admin/jobs/reconcile
